# Unified LLM-as-a-Verifier bundle patch for dsh.
#
# Merges the backend engineering of dsh-llm-as-a-verifier (TaurenMountain)
# with the Best-of-N conversation mode of @aispin/plugin-verifier (Aispin):
#
#   - verify_compare / verify_select / verify_track tools (agent-facing)
#   - Best-of-N conversation mode (backend Best-of-N sampling + fine-grained
#     selection on every assistant turn) plus Web settings panel
#   - service face ctx.verifier (compare/select/track) for code consumers
#
# Verifier endpoint configuration lives in the profile's cordis.patch.yml:
#
#   - id: llm-verifier-pro
#     config:
#       model: opencode-go/deepseek-v4-flash
#       baseUrl: https://omni-pool.jmche.workers.dev/v1
#       apiKey: credential:OMNI_CHAT_API_KEY
#       boN: false            # optional: default Best-of-N off (Web panel / preset enable it)
#       boNCandidates: 5
#
# Credentials resolve: plugin config → OPENAI_BASE_URL/OPENAI_API_KEY →
# DEEPSEEK_API_KEY. Also accepts the dsh credentials seam reference form
# `credential:<name>`.
- insert:
    - id: llm-verifier-pro
      name: 'dsh-llm-verifier-pro'